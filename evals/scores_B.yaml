# =============================================================================
# scores_B.yaml — Scorer B, inter-rater agreement study
# =============================================================================
# Scorer:            B (Claude Code / WSL2), independent of case authorship.
# Instrument:        rubric.yaml v2.0.0 · patterns.yaml v2.0.0 (unmodified)
# Cases:             evals/CASOS_CIEGOS.md — 30 cases (A-01..A-12, B-01..B-18)
# Scored:            2026-07-26
#
# SCORING CONVENTIONS ADOPTED (declared so disagreement can be attributed to
# the instrument rather than to unstated method):
#
#   1. Raw levels only. No inversion for `lower_is_better`, no totals, no
#      verdicts, no gate evaluation. Each dimension scored in isolation.
#
#   2. business_value units. The anchors join person-hours, currency and
#      cases/tickets with "or", and the three are NOT commensurable — the same
#      request lands on different levels depending on which is used. Rule
#      adopted: use the derivable annual PERSON-HOUR or CURRENCY magnitude when
#      the request supports one; fall back to cases/tickets affected only when
#      it does not. Where the units disagree, the disagreement is recorded in
#      ambiguous_anchors with the alternative level named.
#
#   3. Currency. All figures in the cases are Mexican pesos; the anchors are
#      denominated in USD. Converted at ~17-18 MXN/USD. This changes the level
#      for A-06, A-07 and B-03 and is flagged on each.
#
#   4. Missing figures never lower business_value (rubric rule). Where no
#      figure exists, the order of magnitude is estimated from the process
#      described and confidence is set to low.
#
#   5. existing_licensed_capability is NOT matched merely because the request
#      names a platform the company runs as the DATA SOURCE (Salesforce,
#      SharePoint, SAP, Teams, Concur, Active Directory, ServiceNow all appear
#      that way). patterns.yaml states the signals must describe what the
#      requester SAID about the capability, and warns that firing on
#      resemblance was the defect being fixed. Under a literal reading of
#      signal 1 this gate would fire on roughly half the set. The cases where
#      the literal reading and the intended reading diverge are flagged.
#
#   6. `null` is used only where the request supports no level at all. It is
#      never used to avoid a hard call.
# =============================================================================

- case_id: A-01
  archetype: summarization
  anti_pattern_matches: []
  dimensions:
    business_value:
      score: 1
      anchor_level: 1
      confidence: low
      quote: "Son unas ocho juntas al mes entre revisión mensual, forecast y cierre."
      note: 96 meetings a year at roughly 1-2 h of note-taking and distribution each is about 150 person-hours, under the 200 h ceiling of level 1.
    adoption_risk:
      score: 3
      anchor_level: 3
      confidence: low
      quote: "Queremos una IA que escuche la junta y saque los acuerdos y los responsables automáticamente."
      note: The requester speaks for the area but no consultation of the twelve participants, no named adoption owner and no prior-tool history is stated.
    data_readiness:
      score: 3
      anchor_level: 3
      confidence: medium
      quote: "Las juntas son en Teams y quedan grabadas porque ya lo tenemos activado."
      note: Source exists in one system with an access path, but no curated reference summaries and no agreed definition of a good acuerdo.
    process_frequency:
      score: 2
      anchor_level: 2
      confidence: high
      quote: "Frecuencia: 8 al mes"
      note: 96 instances a year falls in the 12-100 band.
    implementation_effort:
      score: 2
      anchor_level: 2
      confidence: low
      quote: "Las juntas son en Teams y quedan grabadas porque ya lo tenemos activado."
      note: Transcription plus distribution on an existing collaboration platform, one process to adjust, one team affected.
    data_governance:
      score: 2
      anchor_level: 2
      confidence: high
      quote: "Clasificación: interno"
      note: Internal financial-planning discussion naming individuals as responsables — internal data with limited personal fields.
    non_ai_alternative:
      score: 4
      anchor_level: 4
      confidence: low
      quote: "Alguien del equipo toma notas en Word y las manda por correo."
      note: A process fix — assigned scribe, standard template, same-day deadline — delivers the stated benefit without an agent; the agent mostly removes the typing.
  ambiguous_anchors:
    - dimension: business_value
      note: "Units disagree: person-hours (~150/yr) gives level 1, cases affected (96 meetings/yr) gives level 2. The anchors' \"or\" makes both readings defensible."
    - dimension: non_ai_alternative
      note: 3 vs 4. The claimed benefit (same-day acuerdos) is fully solved by a process change, but the note-taking labour is not — "roughly half" vs "most of it" has no operational test.
    - dimension: adoption_risk
      note: 2 vs 3 vs 4. The levels are conjunctions of four facts and the request supplies one; nothing says whether users were consulted, so level 4's first clause is neither satisfied nor refuted.

- case_id: A-02
  archetype: extraction
  anti_pattern_matches: []
  dimensions:
    business_value:
      score: 4
      anchor_level: 4
      confidence: high
      quote: "Son unas 2,800 facturas al mes."
      note: Four dedicated capturistas is roughly 7,000 person-hours a year, and 33,600 invoices a year also lands in level 4 — both units agree.
    adoption_risk:
      score: 2
      anchor_level: 2
      confidence: medium
      quote: "Ya intentamos con plantillas por proveedor pero se rompen cada que alguien cambia su formato"
      note: The team has already attempted its own automation, the requester supervises the users, and capture becomes verification inside the same workflow.
    data_readiness:
      score: 5
      anchor_level: 5
      confidence: medium
      quote: "Tenemos todas las facturas de los últimos cuatro años en el repositorio con su captura correspondiente ya validada contra el pago."
      note: Four years of source documents with verified field-level ground truth — an unambiguous outcome variable for a predictive archetype.
    process_frequency:
      score: 5
      anchor_level: 5
      confidence: high
      quote: "Frecuencia: 2,800 al mes"
      note: 33,600 instances a year, above the 10,000 threshold.
    implementation_effort:
      score: 3
      anchor_level: 3
      confidence: low
      quote: "se captura en SAP y se archiva"
      note: Mailbox ingestion, SAP posting integration and a verification UI across two teams — about a quarter, with the 400-format long tail as the risk.
    data_governance:
      score: 3
      anchor_level: 3
      confidence: high
      quote: "Clasificación: confidencial"
      note: Confidential business data (supplier pricing, RFC), permitted with a documented assessment.
    non_ai_alternative:
      score: 2
      anchor_level: 2
      confidence: medium
      quote: "de los 400 proveedores solo los 30 más grandes tienen plantilla"
      note: The deterministic approach was tried and covers a minority of suppliers; the residue is layout variability rules have not captured.
  ambiguous_anchors:
    - dimension: non_ai_alternative
      note: 1 vs 2. Level 1 requires that rule-based attempts "have been tried and are known to fail", which is literally satisfied here, but templates do cover the 30 largest suppliers — possibly most of the volume, which the request does not say.
    - dimension: implementation_effort
      note: 3 vs 4. "A new data pipeline plus a UI" (3) and "several system integrations" (4) both describe this; the distinguishing feature is elapsed quarters, which the request cannot support.
    - dimension: adoption_risk
      note: 2 vs 4. Level 4 fires on "a previous tool built for these same users was quietly abandoned" — the per-supplier templates arguably are that, though they failed technically rather than being rejected by users.

- case_id: A-03
  archetype: rag_qa
  anti_pattern_matches:
    - id: chatbot_without_job_to_be_done
      quote: "Nos gustaría tener un chatbot con IA en la intranet, algo tipo ChatGPT pero de la empresa, para que la gente pueda preguntar lo que sea y no ande buscando en carpetas."
      note: The artefact is an interface; no user, no task and no first question are named.
    - id: solution_first_no_measurable_problem
      quote: "Vimos que otras empresas ya lo tienen y creemos que se ve moderno y ayudaría bastante a la experiencia del empleado."
      note: The driver is what other companies have; no baseline cost, delay or risk is stated.
  dimensions:
    business_value:
      score: 1
      anchor_level: 1
      confidence: low
      quote: "Mejor experiencia del empleado, imagen de innovación."
      note: The benefit as stated is intangible image rather than a magnitude; no volume, headcount or cost supports any larger order of magnitude. Scored on size, not on the absence of a figure.
    adoption_risk:
      score: 4
      anchor_level: 4
      confidence: medium
      quote: "Nos gustaría tener un chatbot con IA en la intranet, algo tipo ChatGPT pero de la empresa"
      note: Requires all employees to adopt an entirely new tool, and no consultation of intended users is reported.
    data_readiness:
      score: 2
      anchor_level: 2
      confidence: low
      quote: "para que la gente pueda preguntar lo que sea y no ande buscando en carpetas."
      note: "\"Lo que sea\" leaves the corpus unbounded — content sits in folders across the intranet with no curation, no ownership and no access path defined."
    process_frequency:
      score: null
      anchor_level: null
      confidence: null
      quote: "Frecuencia: —"
      note: "MISSING: no instance count of any kind — not questions asked, not searches performed, not users. Nothing in the text supports a band."
    implementation_effort:
      score: 3
      anchor_level: 3
      confidence: low
      quote: "Nos gustaría tener un chatbot con IA en la intranet, algo tipo ChatGPT pero de la empresa"
      note: A new conversational UI plus an indexing pipeline over intranet content, and probably a licence to procure — about a quarter at minimum.
    data_governance:
      score: null
      anchor_level: null
      confidence: null
      quote: "Datos: — · Clasificación: —"
      note: "MISSING: the corpus is undefined and unbounded (\"preguntar lo que sea\"), so no classification can be established — it could span internal, confidential and HR content. Note this is a `never_unknown` dimension and also a gate condition."
    non_ai_alternative:
      score: 4
      anchor_level: 4
      confidence: medium
      quote: "La gente busca en la intranet o le pregunta a alguien."
      note: Fixing intranet search and information architecture — configuration of a tool already owned — would solve most of the stated problem.
  ambiguous_anchors:
    - dimension: data_governance
      note: Recorded null rather than guessed. The anchors need a classification the request never gives; an intranet assistant "for anything" plausibly touches every level from 1 to 4.
    - dimension: business_value
      note: 1 vs null. The rubric forbids lowering the score for a missing figure, but here nothing quantifiable exists at all — level 1 and "unscoreable" are hard to separate, and the anchor gives no rule for an intangible benefit.
    - dimension: data_readiness
      note: 2 vs 3. Intranet content exists in a system with an access path (3), but an unbounded corpus with no curation reads as level 2's "spread across systems nobody has joined".

- case_id: A-04
  archetype: extraction
  anti_pattern_matches: []
  dimensions:
