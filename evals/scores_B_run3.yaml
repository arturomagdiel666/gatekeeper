# =============================================================================
# scores_B_run3.yaml — Scorer B, inter-rater agreement study, RUN 3
# =============================================================================
# Scorer:      B (Claude Code / WSL2)
# Instrument:  rubric.yaml + patterns.yaml as repaired by Phase 5 (ADR-029)
# Cases:       evals/CASOS_CIEGOS.md — the same 30, unchanged
# Scored:      2026-07-26
#
# CONVENTIONS ADOPTED, declared so disagreement is attributable to the
# instrument rather than to unstated method.
#
#   1. `resolution: derived` marks a slot settled by a lookup table in the
#      config; `judged` marks one settled by reading anchors. Where a derivation
#      exists and its input is present, it is applied — including where I would
#      have read the anchors differently. Where its input is BLANK the derivation
#      cannot run and the slot is `judged`.
#
#   2. process_frequency: the axis defines the instance and the derivation reads
#      the intake volume field. It no longer tells me to recount, so I do not.
#      The field is taken at face value on all 24 cases that have one.
#
#   3. non_ai_alternative: scored as a PERCENTAGE of instances the deterministic
#      alternative would finish end to end with nobody judging anything
#      afterwards, then banded. The axis now settles the coarse-output case
#      outright: a scorecard, a risk questionnaire or a redline has not finished
#      the instance. I applied that to four cases whose only deterministic
#      alternative is one of those three artefacts, and to the predictive
#      requests, where a rules-based score always emits something and never
#      resolves anything — which is what the sentence is for.
#      Where the share is zero I score 1, because the bands are the test and
#      level 1 is the zero band. See the flag on that anchor's prose.
#
#   4. business_value: unchanged instrument, unchanged procedure. Stated
#      magnitude first, else volume x a stated per-instance duration or cost,
#      else volume alone on the cases band at low confidence, else null.
#      Currency at 17.5 MXN/USD, recorded in the evidence as the dimension
#      requires. A dedicated headcount is NOT read as a stated person-hours
#      magnitude: the scoring_rule forbids working a figure out from the process
#      description, and a headcount is such a figure. This costs B-06 three
#      levels and is flagged there.
#
#   5. data_readiness is min(availability, evaluability), both named in every
#      evidence string. Its sub-anchors were deliberately left for Phase 6.
#
#   6. Anti-patterns: two now carry a two-part test and both parts need their own
#      verbatim quote. Where Part B could not be quoted I did not match, and the
#      case is recorded as a near-miss in `notes.near_misses` instead. Those
#      counts are at the end of this file.
# =============================================================================

- case_id: A-01
  archetype: summarization
  anti_pattern_matches: []
  dimensions:
    business_value:
      score: 2
      anchor_level: 2
      confidence: low
      resolution: derived
      derivation: "volume_only: 8/month = 96 a year -> cases band 50-500 -> 2"
      quote: "Frecuencia: 8 al mes"
      note: No magnitude stated and no per-instance duration on the form, so the weakest denomination applies — it counts meetings affected, not benefit.
    adoption_risk:
      score: 3
      anchor_level: 3
      confidence: low
      resolution: judged
      quote: "Queremos una IA que escuche la junta y saque los acuerdos y los responsables automáticamente."
      note: The requester speaks for the area, but no consultation of the twelve participants, no committed owner and no prior-tool history.
    data_readiness:
      score: 3
      anchor_level: 3
      confidence: medium
      resolution: judged
      quote: "Las juntas son en Teams y quedan grabadas porque ya lo tenemos activado."
      note: Availability 3 — one system, access path, quality unchecked. Evaluability 3 — no agreed definition of a good acuerdo, nothing preventing one. min = 3.
    process_frequency:
      score: 2
      anchor_level: 2
      confidence: high
      resolution: derived
      derivation: "intake_volume: 96 a year -> below 100 -> 2"
      quote: "Frecuencia: 8 al mes"
      note: One meeting is one unit of work the agent handles once, so the field is in the unit the axis defines.
    implementation_effort:
      score: 2
      anchor_level: 2
      confidence: low
      resolution: judged
      quote: "Las juntas son en Teams y quedan grabadas porque ya lo tenemos activado."
      note: Transcription plus distribution on a platform already running; one process to adjust, one team.
    data_governance:
      score: 2
      anchor_level: 2
      confidence: high
      resolution: derived
      derivation: "intake_sensitivity: internal -> 2"
      quote: "Clasificación: interno"
      note: Internal financial-planning discussion naming individuals as responsables.
    non_ai_alternative:
      score: 1
      anchor_level: 1
      confidence: medium
      resolution: judged
      quote: "Alguien del equipo toma notas en Word y las manda por correo."
      note: Zero per cent. A scribe, a template and a same-day deadline finish no meeting without a person writing the acuerdos, and compressing a discussion is judgement.
  ambiguous_anchors:
    - dimension: non_ai_alternative
      note: Level 1's prose gives a reason — "the input is unstructured or genuinely ambiguous, so no deterministic rule can be written" — that is true here, but the level I need is the zero band, and the two are not the same claim. See the flag on B-01, where a rule CAN be written and still finishes nothing.
    - dimension: business_value
      note: The volume-only fallback reads 96 meetings as level 2 while the labour reclaimed is about 150 person-hours, which is level 1. Deterministic, and wrong in a knowable direction.
  notes:
    near_misses:
      - anti_pattern: existing_licensed_capability
        part_a: "Las juntas son en Teams y quedan grabadas porque ya lo tenemos activado."
        part_b: not quotable
        note: Part A is clean — Teams is named and the company runs it. What is already switched on is RECORDING, and the requested job is extracting acuerdos, so nothing in the request says the platform does this job or part of it. Under the old signals this was the shape that produced a match.

