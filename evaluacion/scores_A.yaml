- case_id: A-07
  archetype: classification
  anti_pattern_matches: []
  dimensions:
    business_value:
      score: 4
      anchor_level: 4
      confidence: medium
      quote: 'Cada reemplazo nos cuesta alrededor de 90 mil pesos entre reclutamiento, curva de aprendizaje y cobertura. Perdemos unas 140 personas al año.'
      note: 12.6M MXN a year is roughly 700k USD of exposure, inside the 250k-1M band. Scored as size of the prize, not as the share actually preventable.
    adoption_risk:
      score: 4
      anchor_level: 4
      confidence: medium
      quote: 'para que el jefe directo pueda actuar antes'
      note: The intended users are line managers across 3,000 employees; none consulted, and acting on a risk score is a new workflow for them.
    data_readiness:
      score: 4
      anchor_level: 4
      confidence: medium
      quote: 'También tenemos quién renunció y cuándo.'
      note: Unambiguous outcome variable plus five years of drivers across two systems; quality not checked on a real sample and, being regulated, access is unlikely to come without an exception.
    process_frequency:
      score: 4
      anchor_level: 4
      confidence: low
      quote: 'Personas: 3,000'
      note: Frequency field is blank; derived from the population scored — 3,000 employees evaluated at least annually puts instances in the 1,000-10,000 band. Derivation from a stated number, not a guess about a rate.
    implementation_effort:
      score: 4
      anchor_level: 4
      confidence: medium
      quote: 'Datos: SuccessFactors + nómina · Clasificación: regulado'
      note: Two HR systems to integrate, a regulated-data path to open, and manager behaviour to retrain — two or more quarters.
    data_governance:
      score: 4
      anchor_level: 4
      confidence: high
      quote: 'Clasificación: regulado'
      note: Derivation regulated maps to 4; HR and payroll data, and a level 5 would have to be established as a contractual finding, which the request does not state.
    non_ai_alternative:
      score: 2
      anchor_level: 2
      confidence: low
      quote: 'No se hace. Nos enteramos cuando entregan la carta.'
      note: A query on tenure, no-increment and absenteeism would flag a minority; the rest is multi-factor judgement no rule has captured.
  ambiguous_anchors:
    - dimension: process_frequency
      note: The intake frequency is blank and "instance" is undefined — 140 resignations (3), 3,000 employees scored annually (4), or 36,000 monthly scorings (5). The anchors give no rule for choosing the unit.
    - dimension: data_governance
      note: 4 vs 5 — attrition prediction on regulated HR data is the archetypal works-council case, but the rubric requires a 5 to be established explicitly and the request says nothing.
    - dimension: non_ai_alternative
      note: 2 vs 3 — a stay-interview process change is a genuine non-AI alternative to the whole problem, but the anchors are worded around rules and queries, not around process substitutes at that scale.

- case_id: A-08
  archetype: classification
  anti_pattern_matches:
    - id: deterministic_rule_suffices
      quote: 'el agente verifica identidad con dos preguntas del directorio y ejecuta el reseteo en Active Directory'
      note: The request writes down the complete logic in one sentence — signal "somebody can write down the complete logic".
    - id: rpa_relabeled
      quote: 'El usuario levanta ticket, el agente verifica identidad con dos preguntas del directorio y ejecuta el reseteo en Active Directory.'
      note: Fixed, judgement-free steps against a named system; the inputs are directory fields, not documents or free text.
    - id: existing_licensed_capability
      quote: 'ejecuta el reseteo en Active Directory'
      note: Names a directory platform the company already runs, for which self-service password reset is a native capability.
  dimensions:
    business_value:
      score: 3
      anchor_level: 3
      confidence: medium
      quote: 'Toma unos cuatro minutos. Son como 1,300 tickets al mes.'
      note: 15,600 tickets/yr at four minutes is about 1,040 person-hours — the 1,000-5,000 hour band.
    adoption_risk:
      score: 4
      anchor_level: 4
      confidence: medium
      quote: 'Queremos ponerle IA para que el usuario le escriba a un asistente y este le resetee la contraseña sin que un agente intervenga.'
      note: The intended users are all employees, none consulted, and self-service is a new tool and a new workflow for them.
    data_readiness:
      score: 4
      anchor_level: 4
      confidence: low
      quote: 'el agente verifica identidad con dos preguntas del directorio'
      note: One system, owned by the requesting function, and the outcome (reset succeeded or not) is unambiguous; nothing states quality was checked on a sample.
    process_frequency:
      score: 5
      anchor_level: 5
      confidence: high
      quote: 'Frecuencia: 1,300 al mes'
      note: 15,600/yr exceeds the 10,000 band.
    implementation_effort:
      score: 2
      anchor_level: 2
      confidence: low
      quote: 'El usuario levanta ticket, el agente verifica identidad con dos preguntas del directorio y ejecuta el reseteo en Active Directory.'
      note: A directory integration plus an intake channel; one team, no new vendor.
    data_governance:
      score: 3
      anchor_level: 3
      confidence: medium
      quote: 'Clasificación: confidencial'
      note: Derivation confidential maps to 3, though credential and identity-verification data arguably sits higher.
    non_ai_alternative:
      score: 5
      anchor_level: 5
      confidence: high
      quote: 'El 30% de los tickets que recibimos son reseteos de contraseña.'
      note: Self-service password reset is a deterministic, already-licensed directory capability that solves this completely.
  ambiguous_anchors:
    - dimension: business_value
      note: 3 vs 4 — the person-hours reading gives 3 (1,040 h) and the ticket-count reading gives 4 (15,600 tickets). The rubric calls these "alternative denominations of the same magnitude" but they diverge by a full level whenever the per-instance cost is small.
    - dimension: data_readiness
      note: 3 vs 4 — there is no historical dataset to assess at all here; the dimension's anchors assume a corpus exists to be judged, which does not fit an action-execution request.
    - dimension: implementation_effort
      note: 1 vs 2 — configuring the directory's own self-service is days (1); building an assistant in front of it is weeks (2).
  notes:
    archetype_fit: >-
      No archetype fits well. Recorded as classification because intent
      recognition is the only inference step; the rest is deterministic
      execution. zero_error_tolerance_no_human was NOT recorded — the request
      names an irreversible access change with no reviewer, but never says it
      has to be right every time, and the pattern requires both halves.

