      score: 3
      anchor_level: 3
      confidence: low
      quote: 'Cuatro capturistas. La factura llega por correo a un buzón, se descarga, se captura en SAP y se archiva.'
      note: Users not shown to have been consulted; the step changes from typing to verifying, and their supervisor is the one asking.
    data_readiness:
      score: 4
      anchor_level: 4
      confidence: medium
      quote: 'Tenemos todas las facturas de los últimos cuatro años en el repositorio con su captura correspondiente ya validada contra el pago.'
      note: Labels exist and were validated against payment; no named owner or access commitment is stated, which is what level 5 additionally requires.
    process_frequency:
      score: 5
      anchor_level: 5
      confidence: high
      quote: 'Frecuencia: 2,800 al mes'
      note: 33,600/yr exceeds the 10,000 band.
    implementation_effort:
      score: 3
      anchor_level: 3
      confidence: low
      quote: 'Recibimos facturas en PDF de unos 400 proveedores de servicios e indirectos y cada una viene distinta.'
      note: New ingestion pipeline plus SAP posting plus a verification UI; CxP and IT to coordinate.
    data_governance:
      score: 3
      anchor_level: 3
      confidence: medium
      quote: 'Clasificación: confidencial'
      note: Derivation confidential maps to 3.
    non_ai_alternative:
      score: 2
      anchor_level: 2
      confidence: medium
      quote: 'Ya intentamos con plantillas por proveedor pero se rompen cada que alguien cambia su formato, y de los 400 proveedores solo los 30 más grandes tienen plantilla.'
      note: A rules approach was tried and covers a minority of suppliers; the long tail is layout-variable.
  ambiguous_anchors:
