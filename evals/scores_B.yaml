      score: 3
      anchor_level: 3
      confidence: low
      quote: "Entre 40 minutos y dos horas según el tamaño."
      note: 840 contracts a year at a mean of ~80 minutes is about 1,100 person-hours, just over the level 3 floor.
    adoption_risk:
      score: 2
      anchor_level: 2
      confidence: medium
      quote: "No queremos que apruebe nada, queremos llegar a la revisión sabiendo dónde ver."
      note: The Legal manager requests it for his own three lawyers and scopes it as decision support inside the review they already perform.
    data_readiness:
      score: 3
      anchor_level: 3
      confidence: medium
      quote: "los comentarios de revisión quedaron en los Word con control de cambios, no en un sistema"
      note: Templates and three years of contracts are retrievable, but the review judgements — the only ground truth for risk clauses — are locked in tracked changes with no extraction path.
    process_frequency:
      score: 3
      anchor_level: 3
      confidence: high
      quote: "Frecuencia: 70 al mes"
      note: 840 instances a year falls in the 100-1,000 band.
    implementation_effort:
      score: 3
      anchor_level: 3
      confidence: low
      quote: "Tenemos las plantillas aprobadas y unos tres años de contratos revisados en el repositorio"
      note: Document ingestion, clause comparison and a reviewer UI, plus likely a licence — about a quarter.
    data_governance:
      score: 3
      anchor_level: 3
      confidence: high
      quote: "Clasificación: confidencial"
      note: Confidential commercial terms; processing permitted with a documented assessment and the data owner's approval.
    non_ai_alternative:
      score: 3
      anchor_level: 3
      confidence: low
      quote: "nos marque dónde se apartó de nuestra plantilla y qué cláusulas de riesgo trae"
      note: Half the ask — deviation from the approved template — is a deterministic document comparison; identifying and weighing risk clauses is not.
  ambiguous_anchors:
    - dimension: business_value
      note: Near the 1,000 h boundary between levels 2 and 3 — the midpoint of the stated 40-120 minute range decides it, and the choice of midpoint is the scorer's, not the request's.
