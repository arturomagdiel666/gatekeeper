      note: 3 vs 4. Redline comparison is a capability most organisations already own, which pulls toward 4 and would fire the gate; the risk-clause half pulls toward 2. The anchors offer no way to score a request that is half deterministic.
    - dimension: data_readiness
      note: 2 vs 3. The source contracts are accessible (3) but the labels are "locked inside attachments ... with no access path" (2); the anchor does not say which governs when they differ.

