# =============================================================================
# scores_B_run4.yaml — Scorer B, inter-rater agreement study, RUN 4
# =============================================================================
# Scorer:      B (Claude Code / WSL2)
# Instrument:  rubric.yaml + patterns.yaml as rebuilt by Phase 6 (ADR-030)
# Cases:       evals/CASOS_CIEGOS.md — the same 30, unchanged
# Scored:      2026-07-26
#
# WHAT IS UNDER TEST: non_ai_alternative is now derived from a list of the
# deterministic things that already exist for the work. The 30 cases predate the
# field, so the list is constructed from the request text and recorded per case
# under `artefacts`, then the derivation is applied to it.
#
# CONVENTIONS ADOPTED for building the list, declared because they ARE the entry
# point and therefore where disagreement will live:
#
#   1. DETERMINISTIC means the steps do not turn on a judgement call. A written
#      rule, a query, an export-and-join, a mapping, a form field, a template. A
#      manual procedure counts when its steps are deterministic — one person
#      applying a stated rule is a deterministic artefact with a slow runtime.
#      Writing prose, summarising, classifying free text and deciding what
#      matters are NOT deterministic, however routine.
#
#   2. EXISTS TODAY, in the present tense. A cleanup run once two years ago and
#      not since (A-12) is not doing the work today. Something named as available
#      but not switched on is not either. A thing that exists and is ignored (the
#      templates nobody opens, B-09) IS recorded — it exists, and it visibly
#      fails to finish the work, which is what level 2 says.
#
#   3. `completes_without_judgement` is the load-bearing call and it is mine, not
#      the rubric's. The test applied throughout: does this thing produce the
#      FINAL output of the work, or does a person then decide something? A report
#      or a query produces the answer -> completes. A template, a draft, a search
#      result or a shortlist hands a person something to finish -> does not.
#      Three cases sit genuinely on the line and are flagged: A-05, B-14, B-15.
#
#   4. EMPTY is an answer. Where the request describes only human judgement work
#      ("un analista clasifica manualmente", "se escribe desde cero") the list is
#      empty and the level is 1. `absent` was NOT used on any case: every request
#      says enough about how the work is done today to tell the difference
#      between "nothing exists" and "nobody asked".
#
#   5. `branch` records which arm of the derivation produced the level, so the
#      mechanically-settled cases can be separated from those needing the
#      coverage_rule. 22 of 30 settled mechanically; 8 needed the rule.
#
# Unchanged from earlier runs: business_value's resolution order and the USD
# basis at 17.5 MXN/USD, process_frequency read off the intake field as given,
# data_governance from the sensitivity mapping, data_readiness as
# min(availability, evaluability) with both halves named. data_readiness's
# sub-anchors were deliberately left unrepaired for Phase 6, and it shows.
# =============================================================================

