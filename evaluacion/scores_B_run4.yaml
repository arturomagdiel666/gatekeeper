  dimensions:
    business_value:
      score: 2
      anchor_level: 2
      confidence: low
      resolution: derived
      derivation: "volume_only: 8/month = 96 a year -> cases band 50-500 -> 2"
      quote: "Frecuencia: 8 al mes"
      note: No magnitude stated and no per-instance duration on the form.
    adoption_risk:
      score: 3
      anchor_level: 3
      confidence: low
      resolution: judged
      quote: "Queremos una IA que escuche la junta y saque los acuerdos y los responsables automáticamente."
      note: The requester speaks for the area, but no consultation of the twelve participants, no committed owner and no prior-tool history.
    data_readiness:
      score: 3
      anchor_level: 3
      confidence: medium
      resolution: judged
      quote: "Las juntas son en Teams y quedan grabadas porque ya lo tenemos activado."
      note: Availability 3 — one system, access path, quality unchecked. Evaluability 3 — no agreed definition of a good acuerdo, nothing preventing one. min = 3.
    process_frequency:
      score: 2
      anchor_level: 2
      confidence: high
      resolution: derived
      derivation: "intake_volume: 96 a year -> below 100 -> 2"
      quote: "Frecuencia: 8 al mes"
      note: One meeting is one unit of work.
    implementation_effort:
      score: 2
      anchor_level: 2
      confidence: low
      resolution: judged
      quote: "Las juntas son en Teams y quedan grabadas porque ya lo tenemos activado."
      note: Transcription plus distribution on a platform already running; one process to adjust, one team.
    data_governance:
      score: 2
      anchor_level: 2
      confidence: high
      resolution: derived
      derivation: "intake_sensitivity: internal -> 2"
      quote: "Clasificación: interno"
      note: Internal financial-planning discussion naming individuals as responsables.
    non_ai_alternative:
      score: 2
      anchor_level: 2
      confidence: medium
      resolution: derived
      branch: none_complete
      derivation: "1 artefact exists, none completing -> none_complete -> 2"
      quote: "Alguien del equipo toma notas en Word y las manda por correo."
      note: The recording exists and finishes nothing; note-taking is not deterministic, so it is not an artefact at all.
  ambiguous_anchors:
    - dimension: non_ai_alternative
      note: "Whether the recording is an artefact FOR THIS WORK at all. It is deterministic and running, but it captures the input rather than doing the job. Counted as a non-completing entry (level 2); excluded, the list is empty and the level is 1. The derivation is clean either way — the ambiguity is entirely in building the list."
