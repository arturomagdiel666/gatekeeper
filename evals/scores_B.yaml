    adoption_risk:
      score: 4
      anchor_level: 4
      confidence: medium
      quote: "cada gerente regional arma su propio Excel y cada quien lo calcula distinto"
      note: It overrides a calculation each regional manager chose for themselves, and no consultation of those managers is reported.
    data_readiness:
      score: 3
      anchor_level: 3
      confidence: medium
      quote: "cada quien lo calcula distinto, entonces las juntas de forecast se van en discutir de quién es el número bueno"
      note: One system with an access path, but the definitions are contested — there is no agreed way yet to tell whether an output is right.
    process_frequency:
      score: 2
      anchor_level: 2
      confidence: low
      quote: "Cuatro regiones, junta semanal de forecast."
      note: The target process is the weekly forecast review — 52 instances a year.
    implementation_effort:
      score: 2
      anchor_level: 2
      confidence: low
      quote: "Datos: Salesforce"
      note: Reporting and threshold alerts on a single existing platform; a couple of integrations and one process to adjust.
    data_governance:
      score: 3
      anchor_level: 3
      confidence: high
      quote: "Clasificación: confidencial"
      note: Confidential commercial data (pipeline by seller); permitted with documented assessment and owner approval.
    non_ai_alternative:
      score: 5
      anchor_level: 5
      confidence: medium
      quote: "Cada gerente regional descarga de Salesforce y arma su Excel."
      note: A report or dashboard on the CRM they already license solves this completely and more predictably, including threshold alerts.
  ambiguous_anchors:
    - dimension: process_frequency
      note: "The instance unit is undefined: the weekly meeting (52/yr, level 2), or each opportunity monitored for anomalies (unstated, plausibly level 4-5). The anchors presuppose an obvious unit of \"instance\" that this request does not have."
    - dimension: non_ai_alternative
      note: 4 vs 5. Level 5 includes "an already-licensed capability", which overlaps the existing_licensed_capability anti-pattern and its higher-precedence gate; the same fact can be recorded in two places with different remediation text.
    - dimension: adoption_risk
      note: 4 vs 5. Level 5's "replaces or overrides a way of working they chose themselves" is squarely satisfied, but its other three clauses are not — and the levels are written as conjunctions.

