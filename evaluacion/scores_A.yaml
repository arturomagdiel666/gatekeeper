# Scorer A — inter-rater agreement study
# Rubric: /home/claude/gk/rubric.yaml v2.0.0 · Patterns: /home/claude/gk/patterns.yaml v2.0.0
# Each dimension scored in isolation. No totals, no verdicts. lower_is_better
# dimensions are recorded at the level that DESCRIBES the situation (not inverted).

- case_id: A-01
  archetype: summarization
  anti_pattern_matches:
    - id: existing_licensed_capability
      quote: 'Las juntas son en Teams y quedan grabadas porque ya lo tenemos activado.'
      note: >-
        Signal 1 ("names a specific platform the company already runs") plus an
        explicit statement that part of the capability is already activated.
        Meeting recap sits in the "productivity suite assistant" category the
        pattern notes list. Recorded, but flagged: the requester never says the
        summarisation itself is covered.
  dimensions:
    business_value:
      score: 2
      anchor_level: 2
      confidence: low
      quote: 'Son unas ocho juntas al mes entre revisión mensual, forecast y cierre.'
      note: 96 meetings/yr; note-taking plus write-up ~2h each is roughly 200 person-hours, and 96 instances sits in the 50-500 cases band.
    adoption_risk:
      score: 2
      anchor_level: 2
      confidence: low
      quote: 'Pasamos muchísimo tiempo en juntas de revisión mensual y siempre alguien tiene que tomar notas y luego repartir los acuerdos.'
      note: The requester speaks as one of the intended users and the output replaces a step already in the workflow; no explicit owner commitment stated.
    data_readiness:
      score: 3
      anchor_level: 3
      confidence: medium
      quote: 'Las juntas son en Teams y quedan grabadas porque ya lo tenemos activado.'
      note: Generative archetype — source exists in one system with a clear access path, but no reference set and no agreed definition of a good acuerdo.
    process_frequency:
      score: 2
      anchor_level: 2
      confidence: high
      quote: 'Frecuencia: 8 al mes'
      note: 96 instances/yr falls in the 12-100 band by the deterministic derivation.
    implementation_effort:
      score: 2
      anchor_level: 2
      confidence: low
      quote: 'Alguien del equipo toma notas en Word y las manda por correo.'
      note: Transcript ingestion plus distribution — a couple of integrations, one team, no new vendor.
    data_governance:
      score: 2
      anchor_level: 2
      confidence: medium
      quote: 'Clasificación: interno'
      note: Derivation intake_sensitivity internal maps to 2; recordings contain names and work contact detail.
    non_ai_alternative:
      score: 3
      anchor_level: 3
      confidence: low
      quote: 'Casi nunca salen el mismo día y para cuando llegan ya nadie se acuerda del contexto.'
      note: A process fix (template plus a same-day rule) addresses the delay half of the problem but not the effort half.
  ambiguous_anchors:
    - dimension: business_value
      note: Sat exactly on the 1/2 boundary — the person-hours reading lands near 200/yr and the case-count reading near 96, so the two denominations of the same anchor point at different levels.
    - dimension: adoption_risk
      note: 2 vs 3 — "users were consulted and are supportive" is not stated, but neither is the level-3 condition of adding a new step. Anchors do not cover a change that REMOVES a step.
    - dimension: implementation_effort
      note: 1 vs 2 — if Teams already covers it this is configuration (1); as a build it is 2. The anchor forces an assumption about which path is taken.
    - dimension: non_ai_alternative
      note: 3 vs 4 — anchor 3 is phrased in "cases covered" but the alternative here covers one PART of the problem for all cases, which the anchors have no language for.

