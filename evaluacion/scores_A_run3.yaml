# Scorer A — run 3. Rubric v2.0.0, patterns v2.0.0.
# Currency basis: all currency thresholds are USD. Figures stated in MXN were
# converted at 18.5 MXN = 1 USD (rate recorded in each evidence string as
# required by the business_value CURRENCY BASIS clause).
# Convention used for `resolution`:
#   business_value      -> derived when a stated figure was looked up in a band;
#                          judged when the field was blank/verbal (no lookup).
#   process_frequency   -> derived when the intake volume field held a number;
#                          judged when it was blank or verbal ("semanal").
#   data_governance     -> derived from intake_sensitivity mapping; judged when
#                          the classification field was blank.
#   data_readiness      -> judged (both halves are anchor judgements; the `min`
#                          arithmetic is written into each note).
#   non_ai_alternative  -> derived only where the request states a share;
#                          judged where the percentage is my own estimate.

- case_id: A-01
  archetype: summarization
  anti_pattern_matches: []
  near_misses:
    - id: existing_licensed_capability
      failed_part: B
      note: >-
        Part A is quotable — "Las juntas son en Teams y quedan grabadas porque ya
        lo tenemos activado" names a platform the company runs. Part B is not:
        the request says recording is enabled, i.e. Teams as the place the data
        lives, never that Teams already produces the agreements/owners output or
        that anyone checked whether it does.
  dimensions:
    business_value:
      score: 2
      anchor_level: 2
      confidence: low
      resolution: derived
      quote: "Son unas ocho juntas al mes entre revisión mensual, forecast y cierre."
      note: >-
        No person-hours and no currency figure stated, so the weakest
        denomination (cases) was used: 8/mes x 12 = 96 instancias/año, which
        falls in the 50-500 band -> level 2. Confidence low because volume counts
        instances affected, not benefit.
    adoption_risk:
      score: 3
      anchor_level: 3
      confidence: medium
      resolution: judged
      quote: "Queremos una IA que escuche la junta y saque los acuerdos y los responsables automáticamente."
      note: >-
        The requester is herself a participant so the users are represented, but
        nobody is recorded as having shaped it and no owner has committed to
        driving adoption; it adds a new step (review the generated acuerdos) to
        the existing monthly-review workflow.
    data_readiness:
      score: 3
      anchor_level: 3
      confidence: medium
      resolution: judged
      quote: "Las juntas son en Teams y quedan grabadas porque ya lo tenemos activado."
      note: >-
        AVAILABILITY 3 — recordings are centralized in Teams with a plausible
        access path, but audio/transcription quality has not been checked on real
        records. EVALUABILITY 3 — past Word notes exist but there is no agreed
        definition of what a good acuerdo record must contain, though nothing
        stands in the way of agreeing one. min(3,3) = 3.
    process_frequency:
      score: 2
      anchor_level: 2
      confidence: high
      resolution: derived
      quote: "Frecuencia: 8 al mes"
      note: "Intake volume 8/mes x 12 = 96/año; 96 < 100 -> band 2."
    implementation_effort:
      score: 3
      anchor_level: 3
      confidence: medium
      resolution: judged
      quote: "Alguien del equipo toma notas en Word y las manda por correo."
      note: >-
        About a quarter: a transcription/summarization pipeline over Teams
        recordings plus a distribution workflow change, and plausibly a new
        licence to procure; Finanzas and IT to coordinate.
    data_governance:
      score: 2
      anchor_level: 2
      confidence: high
      resolution: derived
      quote: "Clasificación: interno"
      note: "intake_sensitivity `internal` maps to 2 by the derivation."
    non_ai_alternative:
      score: 1
      anchor_level: 1
      confidence: medium
      resolution: judged
      quote: "Casi nunca salen el mismo día y para cuando llegan ya nadie se acuerda del contexto."
      note: >-
        Estimated share a deterministic alternative finishes end to end: ~0%.
        The input is meeting speech; no rule can extract acuerdos from it, and a
        process fix (make someone send notes the same day) only relocates the
        work to a human writing them, so it does not finish the instance without
        human judgement. 0% -> band 1.
  ambiguous_anchors:
    - dimension: business_value
      note: >-
        The request states minutes-of-meeting effort only as a process
        description, so the person-hours denomination is unavailable under the
        scoring_rule ("Do NOT work one out from the process description") and the
        weakest denomination decided the level.

- case_id: A-02
