      confidence: medium
      resolution: judged
      quote: "Ya intentamos con plantillas por proveedor pero se rompen cada que alguien cambia su formato, y de los 400 proveedores solo los 30 más grandes tienen plantilla."
      note: >-
        Level 4 fires on its "previous tool built for these same users was
        quietly abandoned" clause: the per-supplier templates stalled at 30 of
        400 and are not maintained. Users (the four capturistas) are not recorded
        as consulted.
    data_readiness:
      score: 5
      anchor_level: 5
      confidence: high
      resolution: judged
      quote: "Tenemos todas las facturas de los últimos cuatro años en el repositorio con su captura correspondiente ya validada contra el pago."
      note: >-
        AVAILABILITY 5 — four years of centralized history whose quality has been
        verified on real records (validated against payment). EVALUABILITY 5 —
        the validated capture is an unambiguous outcome variable for a predictive
        archetype. min(5,5) = 5.
    process_frequency:
      score: 5
      anchor_level: 5
      confidence: high
      resolution: derived
      quote: "Frecuencia: 2,800 al mes"
      note: "2,800 x 12 = 33,600/año; 33,600 >= 10,000 -> band 5."
    implementation_effort:
      score: 4
      anchor_level: 4
      confidence: medium
      resolution: judged
      quote: "Recibimos facturas en PDF de unos 400 proveedores de servicios e indirectos y cada una viene distinta."
      note: >-
        Two or more quarters: mailbox intake, document repository, SAP posting
        integration, a verification UI, a 400-format long tail, and the four
        capturistas' work is retrained from typing to reviewing.
    data_governance:
      score: 3
      anchor_level: 3
      confidence: high
      resolution: derived
      quote: "Clasificación: confidencial"
      note: "intake_sensitivity `confidential` maps to 3 by the derivation."
    non_ai_alternative:
      score: 3
      anchor_level: 3
      confidence: low
      resolution: judged
      quote: "de los 400 proveedores solo los 30 más grandes tienen plantilla"
      note: >-
        Estimated share finished end to end by the deterministic alternative:
        ~30-40%. Per-supplier templates already exist and cover the 30 largest
        suppliers (a large share of the 2,800 monthly invoices) but they break on
        format changes; 30-40% falls in the 25-75% band -> level 3.
  ambiguous_anchors:
    - dimension: non_ai_alternative
      note: >-
        Hard to place between 3 and 4. The templates' coverage is stated by
        supplier count (30/400) not by invoice volume, and an upstream process
        fix not mentioned in the request (requiring the structured invoice file
        rather than the PDF) would plausibly push this above 75%. Scored from the
        request's own evidence only.

