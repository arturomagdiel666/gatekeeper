- case_id: A-05
  archetype: anomaly_detection
  anti_pattern_matches:
    - id: reporting_in_disguise
      quote: 'Quiero abrir algo el lunes en la mañana y saber en qué estamos parados sin pedirle nada a nadie.'
      note: Every question in the request is about what already happened; the wanted output is a view.
    - id: existing_licensed_capability
      quote: 'Cada gerente regional descarga de Salesforce y arma su Excel.'
      note: Signal 1 — names a platform the company already runs, and pipeline-by-region reporting is native to it. Recorded with reservation, since the requester does not claim the licence covers it.
  dimensions:
    business_value:
      score: 3
      anchor_level: 3
      confidence: low
      quote: 'Cuatro regiones, junta semanal de forecast.'
      note: Four managers rebuilding an Excel weekly plus 18 people arguing in a weekly meeting is on the order of 1,000-1,500 person-hours a year.
    adoption_risk:
      score: 4
      anchor_level: 4
      confidence: medium
      quote: 'Ahorita cada gerente regional arma su propio Excel y cada quien lo calcula distinto'
      note: Replaces a way of working the regional managers chose for themselves; only the director is asking.
    data_readiness:
      score: 3
      anchor_level: 3
      confidence: medium
      quote: 'Cada gerente regional descarga de Salesforce y arma su Excel.'
      note: One system with an access path, but the fact that each manager computes it differently means no agreed definition of a correct number exists yet.
    process_frequency:
      score: 2
      anchor_level: 2
      confidence: high
      quote: 'Frecuencia: semanal'
      note: 52 instances/yr falls in the 12-100 band.
    implementation_effort:
      score: 2
      anchor_level: 2
      confidence: low
      quote: 'Cada gerente regional descarga de Salesforce y arma su Excel.'
      note: One source system, reporting layer only; the real work is agreeing definitions, not building.
    data_governance:
      score: 3
      anchor_level: 3
      confidence: medium
      quote: 'Clasificación: confidencial'
      note: Derivation confidential maps to 3.
    non_ai_alternative:
      score: 5
      anchor_level: 5
      confidence: high
      quote: 'Necesito que la IA me diga cómo va el pipeline por región y por vendedor'
      note: A report on the CRM answers this completely, more cheaply and more predictably.
  ambiguous_anchors:
    - dimension: business_value
      note: 2 vs 3 — depends entirely on whether the weekly forecast meeting time counts as benefit or only the Excel assembly does; the anchor gives no rule for attributing meeting time.
    - dimension: adoption_risk
      note: 4 vs 5 — anchor 5's four conditions are partly met (overrides a chosen way of working, not consulted) but a named owner exists, and the anchor reads as conjunctive.
    - dimension: implementation_effort
      note: 1 vs 2 — "configuration of a platform already licensed" (1) fits, but the definitional alignment across four regions is the cost, and effort anchors measure duration rather than that kind of work.
    - dimension: process_frequency
      note: The "instance" is ambiguous — 52 weekly reviews (2) or continuous pipeline monitoring (5). I took the stated intake frequency.

