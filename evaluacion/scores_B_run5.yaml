# =============================================================================
# scores_B_run5.yaml — Scorer B, inter-rater agreement study, RUN 5
# =============================================================================
# Scorer:      B (Claude Code / WSL2)
# Instrument:  rubric.yaml + patterns.yaml as rebuilt by Phase 6 (ADR-030)
# Cases:       evals/CASOS_CIEGOS_v2.md — the same 30 requests, now carrying the
#              requester's own answer to the artefact field
# Scored:      2026-07-26
#
# WHAT CHANGED FROM THE PREVIOUS RUN: the artefact list is STATED. It is no
# longer constructed from prose, which is what the working derivations always
# had and this one did not.
#
# CONVENTIONS ADOPTED
#
#   1. The stated section is taken as given. I did not re-derive it, did not add
#      anything I could see elsewhere in the request, and did not overrule a
#      completion flag I disagreed with. Where I would have answered the field
#      differently the case is scored AS STATED and the objection is recorded in
#      ambiguous_anchors. Nine cases carry such an objection.
#
#   2. The coverage rule is applied to the stated entry's own `what_it_does`
#      text, because that is what the rule names. Qualifiers that appear
#      elsewhere in the request but not in the entry — B-03's "para cuando sale
#      ya cambió", for instance — are recorded as objections rather than used,
#      since using them would be re-deriving the field by the back door.
#
#   3. `branch` records which arm produced the level. 26 of 30 settled
#      mechanically on the stated flags; 4 needed the coverage rule.
#
#   4. Unchanged from earlier runs: business_value's resolution order with the
#      USD basis at 17.5 MXN/USD, process_frequency read off the intake volume
#      field as given, data_governance from the sensitivity mapping,
#      data_readiness as min(availability, evaluability) with both halves named.
#      data_readiness's sub-anchors are still unrepaired and it still shows.
# =============================================================================

