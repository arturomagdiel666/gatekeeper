# =============================================================================
# scores_B_run2.yaml — Scorer B, inter-rater agreement study, RUN 2
# =============================================================================
# Scorer:      B (Claude Code / WSL2)
# Instrument:  rubric.yaml v2.0.0 as repaired by Phase 4 (ADR-026/027/028)
#              patterns.yaml v2.0.0 (unchanged from run 1)
# Cases:       evals/CASOS_CIEGOS.md — the same 30, unchanged
# Scored:      2026-07-26
#
# WHAT IS DIFFERENT FROM RUN 1, MECHANICALLY
#
#   `resolved_by: derivation` marks a slot settled by a lookup table in
#   rubric.yaml rather than by reading anchors. Three dimensions can be:
#     process_frequency  — authoritative, from the intake volume band
#     data_governance    — authoritative, from the intake sensitivity mapping
#     business_value     — FALLBACK. Applies only where the request states no
#                          magnitude of its own; the scoring_rule forbids
#                          estimating one from the process description.
#   Everything else is `resolved_by: judgement`.
#
# CONVENTIONS ADOPTED, declared so disagreement is attributable to the
# instrument and not to unstated method:
#
#   1. business_value resolution order, applied in this priority where the
#      request supports more than one reading:
#        (a) a stated per-instance duration x the intake volume -> person-hours
#        (b) a stated annual currency figure
#        (c) a dedicated headcount the request says does this work, read as FTE
#        (d) volume alone, on the cases-or-tickets band, confidence low
#      (a), (b) and (d) come from the rubric. (c) DOES NOT — the scoring_rule
#      does not say whether "a team of three people does this" is a stated
#      person-hours magnitude. I had to rank it, it fires on two cases, and on
#      B-06 it moves the score three levels. Flagged on both.
#
#   2. Currency: anchors are USD, every corpus figure is MXN. Converted at
#      17.5 MXN/USD and the rate is recorded in each affected evidence string,
#      as the dimension now requires. Affects A-06, A-07, B-03.
#
#   3. non_ai_alternative is now a share of instances FINISHED end to end with
#      no human judgement added. I applied this test throughout: "of 100
#      instances, how many does the deterministic thing finish, adequately,
#      without a person making a judgement call?" Two consequences worth
#      naming up front, because they move many scores relative to a
#      "does it help?" reading: a template or a process fix that improves every
#      instance and finishes none scores 1 by the anchor's own words; and a
#      form field a human fills in with a contested category is not
#      deterministic coverage, because the judgement moved rather than went away.
#
#   4. data_readiness is min(availability, evaluability) and both halves are
#      named in every evidence string.
#
#   5. `null` only where the instrument supports no level. For business_value
#      that is branch 4 of its own scoring_rule, not a refusal to work.
# =============================================================================

