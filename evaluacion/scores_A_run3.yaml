- case_id: A-08
  archetype: classification
  anti_pattern_matches:
    - id: rpa_relabeled
      quote: "El usuario levanta ticket, el agente verifica identidad con dos preguntas del directorio y ejecuta el reseteo en Active Directory."
    - id: deterministic_rule_suffices
      quote: "el agente verifica identidad con dos preguntas del directorio y ejecuta el reseteo en Active Directory"
      second_quote: "Datos: Active Directory"
  near_misses:
    - id: existing_licensed_capability
      failed_part: B
      note: >-
        Part A is quotable — Active Directory is a named platform the company
        runs. Part B is not: the request describes AD as the system where the
        reset is executed, never that AD (or any licensed tool) already offers
        self-service reset, and nobody asks whether it could. Without Part B
        there is no match.
    - id: zero_error_tolerance_no_human
      failed_part: B
      note: >-
        The "no human in the loop" half is quotable — "sin que un agente
        intervenga" over an access change. The accuracy half is not: the request
        never says it has to be right every time or that no error is acceptable,
        and patterns.yaml requires both halves to be present.
  dimensions:
    business_value:
      score: 4
      anchor_level: 4
