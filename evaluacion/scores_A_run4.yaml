# Scorer A — run 4. Rubric v2.0.0, patterns v2.0.0.
# Conventions used throughout (declared once, applied uniformly):
#  - business_value: scoring_rule step (1). Denomination priority follows the
#    derivation's declaration order (person_hours -> currency -> cases).
#    person_hours is only used where the request states a PER-INSTANCE duration
#    (the derivation's input is `minutes_per_instance`); otherwise the cases
#    denomination is used and confidence is low (`volume_only`). Currency bands
#    are USD; MXN converted at 18 MXN/USD (rate in effect), recorded in evidence.
#  - process_frequency / data_governance: derived from the intake lines
#    (Frecuencia / Clasificación) when present; `judged` or null when "—".
#  - non_ai_alternative: artefact list built from the request text, then the
#    derivation applied. Non-deterministic human judgement (a lawyer reading, an
#    analyst classifying, a translation agency) is NOT an artefact. A thing that
#    exists but is not running today is NOT an artefact. Templates, catalogues
#    and mappings the request refers to as held ARE artefacts.

- case_id: A-01
  archetype: summarization
  artefacts:
    - name: "Grabación automática de las juntas en Teams"
      what_it_does: "Produces a recording of each review meeting; it is already switched on"
      completes_without_judgement: false
      quote: "Las juntas son en Teams y quedan grabadas porque ya lo tenemos activado."
  anti_pattern_matches: []
  near_misses:
    - pattern: existing_licensed_capability
      failed_part: "Part B"
      note: "Part A quotable ('Las juntas son en Teams'); Part B not — Teams is named as where the recording lives, never as a platform that already produces the acuerdos. Exactly the ruled-out error."
  dimensions:
    business_value: {score: 2, anchor_level: 2, confidence: low, resolution: derived, quote: "Son unas ocho juntas al mes entre revisión mensual, forecast y cierre.", note: "cases denomination (volume_only, confidence low): 8/month x 12 = 96 instances/year, which falls in the 50-500 band = level 2. No person-hours or currency figure stated ('Pasamos muchísimo tiempo' is not a magnitude)."}
    adoption_risk: {score: 2, anchor_level: 2, confidence: medium, resolution: judged, quote: "Queremos una IA que escuche la junta y saque los acuerdos y los responsables automáticamente.", note: "The requester manages the area whose meetings these are and the change removes a step from a workflow (Teams meetings) they already run daily. No previous-tool history stated, so level 1 is not available."}
    data_readiness: {score: 3, anchor_level: 3, confidence: medium, resolution: judged, quote: "Alguien del equipo toma notas en Word y las manda por correo.", note: "AVAILABILITY 3 — recordings exist in Teams (one system, plausible access path) but audio/transcript quality never checked on real records. EVALUABILITY 3 — generative archetype; past Word minutes exist but no agreed criteria for a good acuerdos list, nothing standing in the way of agreeing one. min(3,3)=3."}
    process_frequency: {score: 2, anchor_level: 2, confidence: high, resolution: derived, quote: "Frecuencia: 8 al mes", note: "8 x 12 = 96 instances/year; 96 < 100 -> band 2."}
    implementation_effort: {score: 2, anchor_level: 2, confidence: medium, resolution: judged, quote: "Las juntas son en Teams y quedan grabadas porque ya lo tenemos activado.", note: "Two to six weeks: transcription hook plus distribution of the acuerdos, one team affected, no new vendor."}
    data_governance: {score: 2, anchor_level: 2, confidence: high, resolution: derived, quote: "Clasificación: interno", note: "intake_sensitivity mapping internal -> 2."}
    non_ai_alternative: {score: 2, anchor_level: 2, confidence: medium, resolution: derived, branch: none_complete, quote: "Las juntas son en Teams y quedan grabadas porque ya lo tenemos activado.", note: "One artefact (the recording) exists and runs today; after it runs somebody still has to extract acuerdos and responsables. Manual note-taking excluded from the list as non-deterministic. -> none_complete = 2."}
  ambiguous_anchors:
    - "data_readiness 3 vs 4 (evaluability): whether past Word minutes count as 'a handful of reference outputs'."

