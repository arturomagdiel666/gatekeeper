      note: 4 vs 5 — the label quality here is better than anchor 4 describes, but the access-owner clause in anchor 5 is unaddressed, so one clause alone blocks the top level.
    - dimension: implementation_effort
      note: 3 vs 4 — "several system integrations" (mailbox, repository, SAP) reads as 4, while "one quarter, new pipeline plus workflow change" reads as 3; the anchors overlap on this shape of request.
    - dimension: non_ai_alternative
      note: 1 vs 2 — anchor 1 requires rule-based attempts "tried and known to fail", which is literally satisfied, yet templates still work for the 30 largest suppliers, which is anchor 2.

- case_id: A-03
  archetype: rag_qa
  anti_pattern_matches:
    - id: chatbot_without_job_to_be_done
      quote: 'Nos gustaría tener un chatbot con IA en la intranet, algo tipo ChatGPT pero de la empresa, para que la gente pueda preguntar lo que sea'
      note: The artefact is the interface; no stated user task and no first question anyone would type.
    - id: solution_first_no_measurable_problem
      quote: 'Vimos que otras empresas ya lo tienen y creemos que se ve moderno y ayudaría bastante a la experiencia del empleado.'
      note: Driver is imitation; no baseline cost or delay anywhere in the request.
  dimensions:
    business_value:
      score: 2
      anchor_level: 2
      confidence: low
      quote: 'Mejor experiencia del empleado, imagen de innovación.'
      note: No figure given; estimated order of magnitude from a diffuse intranet-search benefit with no defined task — a few hundred person-hours at most. Missing number did not lower the score, the diffuseness of the described process did.
    adoption_risk:
      score: 4
      anchor_level: 4
      confidence: medium
      quote: 'La gente busca en la intranet o le pregunta a alguien.'
      note: Requires employees to adopt an entirely new tool; no evidence of consultation and the solicitante field is empty.
    data_readiness:
      score: 2
      anchor_level: 2
      confidence: medium
      quote: 'para que la gente pueda preguntar lo que sea y no ande buscando en carpetas'
      note: Content exists but is scattered across folders nobody has curated; no corpus boundary and no quality criteria for a generative archetype.
    process_frequency:
      score: null
      anchor_level: null
      confidence: null
      quote: 'Frecuencia: —'
      note: MISSING — no volume, no periodicity, no headcount, and no statement of how often anyone searches. Not guessed.
    implementation_effort:
      score: 4
      anchor_level: 4
      confidence: low
      quote: 'Nos gustaría tener un chatbot con IA en la intranet, algo tipo ChatGPT pero de la empresa'
      note: A new platform component with unbounded scope; corpus curation would dominate.
    data_governance:
      score: 2
      anchor_level: 2
      confidence: low
      quote: 'para que la gente pueda preguntar lo que sea y no ande buscando en carpetas'
      note: Classification field is blank; intranet content reads as internal with limited personal fields. Scored rather than nulled because data_governance is a never_unknown gate dimension, but the "lo que sea" scope could pull in restricted content.
    non_ai_alternative:
      score: 4
      anchor_level: 4
      confidence: low
      quote: 'La gente busca en la intranet o le pregunta a alguien.'
      note: Configuring the search the intranet already has would address most of "no ande buscando en carpetas".
  ambiguous_anchors:
    - dimension: data_governance
      note: The classification field is blank and the request scope is explicitly unbounded; scoring 2 is an inference the anchors give no way to qualify, but never_unknown forbids null.
    - dimension: data_readiness
      note: 2 vs 3 — intranet content is arguably "one or two systems with a plausible access path" (3), but no corpus has been defined at all, which reads as 2.
    - dimension: implementation_effort
      note: 3 vs 4 — with no scope stated, the anchors (which are calibrated on duration) cannot be applied without inventing the scope.

