# Completing entries: A-02, A-08, B-03, B-07 (four).
#
# Divergences from what the scorers constructed in run 4, and why:
#   A-09, B-02, B-16 — a person reading free text and choosing a category is
#     judgement (R4), so no artefact. Scorer B had B-16 as coverage_all.
#   B-09 — templates nobody opens are not running (R2). Scorer B had them as
#     an artefact.
#   B-01, B-05, B-06, B-10, B-12, B-17 — archives and shared folders produce
#     nothing (R1).
#   A-05, B-14, B-15 — the artefact exists and the text shows a person still
#     deciding afterwards (R5), so completing is false. Scorer B read all
#     three as completing.
#
# These are authoring decisions, not corrections of either scorer. They are
# listed so that the re-run measures agreement on a STATED field rather than
# agreement on how to invent one.
