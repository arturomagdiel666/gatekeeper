- case_id: A-07
  archetype: forecasting
  anti_pattern_matches: []
  dimensions:
    business_value:
      score: 4
      anchor_level: 4
      confidence: low
      quote: "Cada reemplazo nos cuesta alrededor de 90 mil pesos entre reclutamiento, curva de aprendizaje y cobertura. Perdemos unas 140 personas al año."
      note: 12.6M MXN a year is roughly 700k USD, inside the 250k-1M band; only a fraction of attrition is preventable but the axis measures the size of the prize.
    adoption_risk:
      score: 4
      anchor_level: 4
      confidence: medium
      quote: "para que el jefe directo pueda actuar antes"
      note: The intended users are line managers company-wide; no consultation is reported and acting on a risk score is a new workflow for them.
    data_readiness:
      score: 4
      anchor_level: 4
      confidence: low
      quote: "También tenemos quién renunció y cuándo."
      note: Five years of drivers plus an unambiguous outcome variable across two systems; quality has not been checked on a real sample and regulated access needs an exception, which blocks level 5.
    process_frequency:
      score: 4
      anchor_level: 4
      confidence: low
      quote: "Personas: 3,000"
      note: The prediction runs over 3,000 employees per cycle, so at least 3,000 instances a year — inside the 1,000-10,000 band.
    implementation_effort:
      score: 4
      anchor_level: 4
      confidence: low
      quote: "Datos: SuccessFactors + nómina"
      note: Two HR system integrations, a model pipeline, a privacy impact assessment and manager enablement — two or more quarters.
    data_governance:
      score: 4
      anchor_level: 4
      confidence: high
      quote: "Clasificación: regulado"
      note: Regulated HR and payroll data; external processing needs a contractual clause or impact assessment not stated to be in place, and access needs a formal exception.
    non_ai_alternative:
      score: 3
      anchor_level: 3
      confidence: low
      quote: "Tenemos los datos de nómina, antigüedad, evaluaciones de desempeño, incrementos, ausentismo y las encuestas de clima de los últimos cinco años."
      note: A report on a handful of known risk indicators would surface a substantial share of at-risk staff; the model extends coverage rather than creating the capability.
  ambiguous_anchors:
    - dimension: business_value
      note: "Three units, three answers: currency (12.6M MXN ≈ 700k USD) gives 4; cases affected (140 resignations/yr) gives 2; the same figure read as if the anchors were in pesos gives 5. Nothing in the anchor resolves this."
    - dimension: process_frequency
      note: For a forecasting archetype the "instance" is ambiguous between scoring events (3,000+/yr, level 4) and business events acted upon (140 resignations, level 2). The intake frequency field is blank, so the deterministic derivation does not apply.
    - dimension: data_governance
      note: 4 vs 5. Employee-attrition profiling is the paradigm case for level 5's "works council approval that has not been obtained", but the request says nothing either way, and the derivation table caps `regulado` at 4 — so a genuine 5 depends entirely on a fact no requester would volunteer.
    - dimension: data_readiness
      note: 3 vs 4. Level 4 requires quality "checked on a real sample", which almost no request states; taken strictly it caps well-instrumented requests at 3 by construction.

