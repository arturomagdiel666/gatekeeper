# Authored intake field: existing_deterministic_artefacts
#
# Written by the corpus author, once, for all 30 cases — not by either scorer.
# In production this field is filled by the requester. Both scorers previously had
# to construct it from prose, which was the confound in run 4.
#
# AUTHORING RULES, applied uniformly and stated so the result is auditable:
#
#   R1. An artefact must PRODUCE something when it runs. A passive holding —
#       an archive, a catalogue, a repository of past work — produces nothing
#       and is not an artefact. This resolves the "1 vs 2" ambiguity both
#       scorers flagged.
#   R2. A thing not running today is not an artefact: switched off, done once
#       two years ago, or sitting in a document nobody opens.
#   R3. An LLM-based tool is not deterministic.
#   R4. A human following a deterministic procedure IS an artefact. A human
#       exercising judgement is not.
#   R5. `completes_without_judgement` is answered from what the request says
#       happens next. If the text shows a person still deciding, arguing, or
#       adding criterion afterwards, it is false.
#
# Every entry carries the verbatim sentence it was drawn from.

