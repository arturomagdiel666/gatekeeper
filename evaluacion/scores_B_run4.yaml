    - dimension: non_ai_alternative
      note: "`part` is unambiguous from the text, and the residual question the rule does not ask is what share of the 33,600 INVOICES those 30 suppliers account for — supplier coverage and instance coverage are not the same number. It happens not to matter: 30 of 400 and any plausible volume share both land in `part`."

